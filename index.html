<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }
    .cart {
      background-color: #fff;
      padding: 10px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .cart-list {
      max-width: 600px;
      margin: 10px auto;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      display: none;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 20px;
      justify-content: center;
    }
    .product {
      background-color: white;
      border: 1px solid #ccc;
      padding: 10px;
      width: 100%;
      max-width: 200px;
      text-align: center;
      transition: box-shadow 0.3s ease;
      box-sizing: border-box;
    }
    .product:hover {
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .product img {
      max-width: 100%;
      height: auto;
    }
    .product h3 {
      margin: 10px 0 5px;
    }
    .product p {
      font-size: 14px;
      color: #555;
    }
    .product .price {
      font-size: 16px;
      color: #333;
      margin: 10px 0;
    }
    .product button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      margin-top: 10px;
    }
    .product button:hover {
      background-color: #218838;
    }
    .remove-btn {
      background-color: #dc3545;
      margin-left: 10px;
    }
    .total-price {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      .container {
        padding: 10px;
        gap: 10px;
      }
      .product {
        flex: 0 0 48%;
        max-width: 48%;
      }
    }
  </style>
</head>
<body>
  <header>
    Katalog Produk
  </header>

  <div class="cart" id="cart">
    Keranjang: <span id="cartCount">0</span> produk
  </div>

  <div class="cart-list" id="cartList">
    <div class="total-price" id="totalPrice">Total Harga: Rp 0</div>
  </div>

  <div class="container" id="productContainer"></div>

  <script>
    const products = Array.from({ length: 50 }, (_, i) => {
      let image;
      let price;
      switch (i) {
        case 0:
          image = "https://tokyofreshdirect.com/cdn/shop/articles/not-to-be-missed-when-visiting-tokyo-the-complete-guide-to-tokyo-banana-494990_600x600_crop_center.png?v=1709777358";
          price = 50000;
          break;
        case 1:
          image = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQfusQRLdGa4FDGUUX1bBQW5Pih3xaTDEgyA&s";
          price = 35000;
          break;
        case 2:
          image = "https://oishipedia.com/wp-content/uploads/2024/02/47be2968bf062eb2aee52cf98beb6d3b-edited.jpg";
          price = 25000;
          break;
        case 3:
          image = "https://oishipedia.com/wp-content/uploads/2024/02/lotte-almond-chocolate-edited-1.jpg";
          price = 30000;
          break;
        case 4:
          image = "https://www.ubuy.com.lb/productimg/?image=aHR0cHM6Ly9tLm1lZGlhLWFtYXpvbi5jb20vaW1hZ2VzL0kvNzFaQ2lNbFRaM0wuX1NMMTUwMF8uanBn.jpg";
          price = 20000;
          break;
        default:
          image = `https://via.placeholder.com/250x150?text=Produk+${i + 1}`;
          price = Math.floor(Math.random() * 100000) + 10000;
      }
      return {
        name: `Produk ${i + 1}`,
        description: `Deskripsi lengkap untuk Produk ${i + 1}. Ini adalah produk berkualitas tinggi yang layak Anda miliki.`,
        image: image,
        price: price
      };
    });

    let cart = {};
    const container = document.getElementById('productContainer');
    const cartDisplay = document.getElementById('cartCount');
    const cartList = document.getElementById('cartList');
    const totalPriceDisplay = document.getElementById('totalPrice');

    function updateCart() {
      const totalItems = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
      cartDisplay.textContent = totalItems;
      let totalPrice = 0;
      Object.entries(cart).forEach(([item, qty]) => {
        const product = products.find(p => p.name === item);
        totalPrice += product.price * qty;
      });
      totalPriceDisplay.textContent = `Total Harga: Rp ${totalPrice.toLocaleString()}`;
      
      if (totalItems === 0) {
        cartList.style.display = 'none';
        return;
      }
      cartList.style.display = 'block';
      cartList.innerHTML = '<h4>Isi Keranjang:</h4><ul>' +
        Object.entries(cart).map(([item, qty]) => `
          <li>${item} x ${qty} <button class="remove-btn" onclick="removeFromCart('${item}')">Hapus</button></li>
        `).join('') + '</ul>';
    }

    function removeFromCart(item) {
      if (cart[item]) {
        cart[item]--;
        if (cart[item] === 0) delete cart[item];
        updateCart();
      }
    }

    products.forEach(product => {
      const div = document.createElement('div');
      div.className = 'product';
      div.innerHTML = `
        <img src="${product.image}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p>${product.description}</p>
        <div class="price">Rp ${product.price.toLocaleString()}</div>
        <button>Tambah ke Keranjang</button>
      `;
      const button = div.querySelector('button');
      button.addEventListener('click', () => {
        if (cart[product.name]) {
          cart[product.name]++;
        } else {
          cart[product.name] = 1;
        }
        updateCart();
      });
      container.appendChild(div);
    });
  </script>
</body>
</html>
