<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 20px;
      justify-content: center;
    }
    .product {
      background-color: white;
      border: 1px solid #ccc;
      padding: 10px;
      width: 200px;
      text-align: center;
      transition: box-shadow 0.3s ease;
    }
    .product:hover {
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .product img {
      max-width: 100%;
      height: auto;
    }
    .product h3 {
      margin: 10px 0 5px;
    }
    .product p {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    Katalog Produk
  </header>

  <div class="container" id="productContainer"></div>

  <script>
    const products = Array.from({ length: 50 }, (_, i) => {
      let image;
      switch (i) {
        case 0:
          image = "https://tokyofreshdirect.com/cdn/shop/articles/not-to-be-missed-when-visiting-tokyo-the-complete-guide-to-tokyo-banana-494990_600x600_crop_center.png?v=1709777358";
          break;
        case 1:
          image = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQfusQRLdGa4FDGUUX1bBQW5Pih3xaTDEgyA&s";
          break;
        case 2:
          image = "https://oishipedia.com/wp-content/uploads/2024/02/47be2968bf062eb2aee52cf98beb6d3b-edited.jpg";
          break;
        case 3:
          image = "https://oishipedia.com/wp-content/uploads/2024/02/lotte-almond-chocolate-edited-1.jpg";
          break;
        case 4:
          image = "https://www.ubuy.com.lb/productimg/?image=aHR0cHM6Ly9tLm1lZGlhLWFtYXpvbi5jb20vaW1hZ2VzL0kvNzFaQ2lNbFRaM0wuX1NMMTUwMF8uanBn.jpg";
          break;
        default:
          image = `https://via.placeholder.com/250x150?text=Produk+${i + 1}`;
      }
      return {
        name: `Produk ${i + 1}`,
        description: `Deskripsi lengkap untuk Produk ${i + 1}. Ini adalah produk berkualitas tinggi yang layak Anda miliki.`,
        image: image
      };
    });

    const container = document.getElementById('productContainer');

    products.forEach(product => {
      const div = document.createElement('div');
      div.className = 'product';
      div.innerHTML = `
        <img src="${product.image}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p>${product.description}</p>
      `;
      container.appendChild(div);
    });
  </script>
</body>
</html>
