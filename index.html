<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Katalog Produk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --primary-color: #0d6efd;
      --accent-color: #ffc107;
      --danger-color: #dc3545;
      --background-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #dee2e6;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background-color);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      box-shadow: var(--shadow);
    }

    .cart {
      background-color: white;
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }

    .cart-list {
      max-width: 600px;
      margin: 10px auto;
      padding: 20px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: none;
      box-shadow: var(--shadow);
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      justify-content: center;
    }

    .product {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 15px;
      width: 100%;
      max-width: 220px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: var(--shadow);
      flex: 0 0 220px;
    }

    .product:hover {
      transform: translateY(-6px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .product img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    .product img:hover {
      transform: scale(1.05);
    }

    .product h3 {
      margin: 10px 0 5px;
      font-size: 18px;
      color: #333;
    }

    .product p {
      font-size: 14px;
      color: #555;
    }

    .product span {
      display: block;
      font-weight: bold;
      margin-top: 8px;
      color: var(--primary-color);
    }

    .product button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      margin-top: 12px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .product button:hover {
      background-color: #e0a800;
    }

    .remove-btn {
      background-color: var(--danger-color);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-left: 8px;
    }

    .remove-btn:hover {
      background-color: #c82333;
    }

    .checkout {
      margin-top: 20px;
      text-align: center;
    }

    .checkout button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .checkout button:hover {
      background-color: #0b5ed7;
    }

    .popup {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--primary-color);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 1000;
      animation: fadeInOut 2s ease forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 600px) {
      .product {
        flex: 0 0 48%;
        max-width: 48%;
      }
    }
  </style>
</head>
<body>
  <header>Katalog Produk</header>

  <div class="cart" id="cart">
    <i class="fas fa-shopping-cart"></i> Keranjang: <span id="cartCount">0</span> produk
  </div>

  <div class="cart-list" id="cartList">
    <h4>Isi Keranjang:</h4>
    <ul id="cartItems"></ul>
    <div class="total-price" id="totalPrice">Total Harga: Rp 0</div>
    <div class="checkout">
      <button onclick="checkout()">Bayar Sekarang</button>
    </div>
  </div>

  <div class="container" id="productContainer"></div>
  <div id="popupContainer"></div>

  <script>
    const products = [
      {
        name: "Tokyo Banana",
        price: 35000,
        image: "https://tokyofreshdirect.com/cdn/shop/articles/not-to-be-missed-when-visiting-tokyo-the-complete-guide-to-tokyo-banana-494990_600x600_crop_center.png?v=1709777358",
        description: "Kue pisang khas Jepang dengan krim lembut."
      },
      {
        name: "Pocky Coklat",
        price: 15000,
        image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQfusQRLdGa4FDGUUX1bBQW5Pih3xaTDEgyA&s",
        description: "Biskuit stik berlapis coklat."
      },
      {
        name: "KitKat Matcha",
        price: 28000,
        image: "https://oishipedia.com/wp-content/uploads/2024/02/47be2968bf062eb2aee52cf98beb6d3b-edited.jpg",
        description: "Cokelat KitKat rasa teh hijau Jepang."
      },
      {
        name: "Lotte Almond",
        price: 30000,
        image: "https://oishipedia.com/wp-content/uploads/2024/02/lotte-almond-chocolate-edited-1.jpg",
        description: "Cokelat almond renyah dan manis."
      },
      {
        name: "Meiji Hello Panda",
        price: 25000,
        image: "https://www.ubuy.com.lb/productimg/?image=aHR0cHM6Ly9tLm1lZGlhLWFtYXpvbi5jb20vaW1hZ2VzL0kvNzFaQ2lNbFRaM0wuX1NMMTUwMF8uanBn.jpg",
        description: "Biskuit isi cokelat dengan karakter panda."
      }
    ];

    const cart = {};
    const container = document.getElementById('productContainer');
    const cartDisplay = document.getElementById('cartCount');
    const cartItems = document.getElementById('cartItems');
    const cartList = document.getElementById('cartList');
    const totalPriceDisplay = document.getElementById('totalPrice');

    function showPopup(message) {
      const popup = document.createElement('div');
      popup.className = 'popup';
      popup.textContent = message;
      document.getElementById('popupContainer').appendChild(popup);
      setTimeout(() => popup.remove(), 2000);
    }

    function updateCart() {
      let total = 0;
      let totalItems = 0;
      cartItems.innerHTML = '';
      for (const name in cart) {
        const { qty, price } = cart[name];
        totalItems += qty;
        total += qty * price;
        const li = document.createElement('li');
        li.innerHTML = `${name} x ${qty} 
          <button class="remove-btn" onclick="removeFromCart('${name}')">Hapus</button>`;
        cartItems.appendChild(li);
      }
      cartDisplay.textContent = totalItems;
      totalPriceDisplay.textContent = `Total Harga: Rp ${total.toLocaleString()}`;
      cartList.style.display = totalItems > 0 ? 'block' : 'none';
    }

    function removeFromCart(name) {
      if (cart[name]) {
        cart[name].qty--;
        if (cart[name].qty === 0) delete cart[name];
        updateCart();
      }
    }

    function checkout() {
      alert("Terima kasih! Pesanan Anda sedang diproses.");
      Object.keys(cart).forEach(key => delete cart[key]);
      updateCart();
    }

    products.forEach(product => {
      const div = document.createElement('div');
      div.className = 'product';
      div.innerHTML = `
        <img src="${product.image}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p>${product.description}</p>
        <span>Rp ${product.price.toLocaleString()}</span>
        <button><i class="fas fa-cart-plus"></i> Tambah ke Keranjang</button>
      `;
      div.querySelector('button').addEventListener('click', () => {
        if (cart[product.name]) {
          cart[product.name].qty++;
        } else {
          cart[product.name] = { qty: 1, price: product.price };
        }
        updateCart();
        showPopup(`${product.name} ditambahkan ke keranjang!`);
      });
      container.appendChild(div);
    });
  </script>
</body>
</html>
