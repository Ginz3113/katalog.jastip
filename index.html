<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #0d6efd;
      --accent-color: #ffc107;
      --danger-color: #dc3545;
      --background-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #dee2e6;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background-color);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      box-shadow: var(--shadow);
    }
    .cart {
      background-color: white;
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .cart-list {
      max-width: 600px;
      margin: 10px auto;
      padding: 20px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: none;
      box-shadow: var(--shadow);
      animation: fadeIn 0.3s ease-in-out;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      justify-content: center;
    }
    .product {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 15px;
      width: 100%;
      max-width: 220px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: var(--shadow);
    }
    .product:hover {
      transform: translateY(-6px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }
    .product img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }
    .product img:hover {
      transform: scale(1.05);
    }
    .product h3 {
      margin: 10px 0 5px;
      font-size: 18px;
      color: #333;
    }
    .product p {
      font-size: 14px;
      color: #555;
    }
    .product span {
      display: block;
      font-weight: bold;
      margin-top: 8px;
      color: var(--primary-color);
    }
    .product button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      margin-top: 12px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .product button:hover {
      background-color: #e0a800;
    }
    .remove-btn {
      background-color: var(--danger-color);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .remove-btn:hover {
      background-color: #c82333;
    }
    .checkout {
      margin-top: 20px;
      text-align: center;
    }
    .checkout button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .checkout button:hover {
      background-color: #0b5ed7;
    }
    @media (max-width: 600px) {
      .product {
        flex: 0 0 48%;
        max-width: 48%;
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <i class="fas fa-store"></i> Katalog Produk
  </header>

  <div class="cart" id="cart">
    <i class="fas fa-shopping-cart"></i> Keranjang: <span id="cartCount">0</span> produk - Total: <span id="totalPrice">Rp0</span>
  </div>

  <div class="cart-list" id="cartList"></div>
  <div class="checkout" id="checkout" style="display:none">
    <button onclick="checkout()"><i class="fas fa-money-bill-wave"></i> Bayar Sekarang</button>
  </div>

  <div class="container" id="productContainer"></div>

  <script>
    const products = Array.from({ length: 50 }, (_, i) => {
      let image;
      let price = (Math.floor(Math.random() * 50) + 10) * 1000;
      switch (i) {
        case 0:
          image = "https://tokyofreshdirect.com/cdn/shop/articles/not-to-be-missed-when-visiting-tokyo-the-complete-guide-to-tokyo-banana-494990_600x600_crop_center.png?v=1709777358";
          break;
        case 1:
          image = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQfusQRLdGa4FDGUUX1bBQW5Pih3xaTDEgyA&s";
          break;
        case 2:
          image = "https://oishipedia.com/wp-content/uploads/2024/02/47be2968bf062eb2aee52cf98beb6d3b-edited.jpg";
          break;
        case 3:
          image = "https://oishipedia.com/wp-content/uploads/2024/02/lotte-almond-chocolate-edited-1.jpg";
          break;
        case 4:
          image = "https://www.ubuy.com.lb/productimg/?image=aHR0cHM6Ly9tLm1lZGlhLWFtYXpvbi5jb20vaW1hZ2VzL0kvNzFaQ2lNbFRaM0wuX1NMMTUwMF8uanBn.jpg";
          break;
        default:
          image = `https://via.placeholder.com/250x150?text=Produk+${i + 1}`;
      }
      return {
        name: `Produk ${i + 1}`,
        description: `Deskripsi lengkap untuk Produk ${i + 1}. Ini adalah produk berkualitas tinggi yang layak Anda miliki.`,
        image,
        price
      };
    });

    let cart = {};
    const container = document.getElementById('productContainer');
    const cartDisplay = document.getElementById('cartCount');
    const cartList = document.getElementById('cartList');
    const totalPriceDisplay = document.getElementById('totalPrice');
    const checkoutDiv = document.getElementById('checkout');

    function updateCart() {
      const totalItems = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = Object.values(cart).reduce((sum, item) => sum + item.qty * item.price, 0);
      cartDisplay.textContent = totalItems;
      totalPriceDisplay.textContent = `Rp${totalPrice.toLocaleString()}`;

      if (totalItems === 0) {
        cartList.style.display = 'none';
        checkoutDiv.style.display = 'none';
        return;
      }

      cartList.style.display = 'block';
      checkoutDiv.style.display = 'block';

      cartList.innerHTML = '<h4><i class="fas fa-shopping-bag"></i> Isi Keranjang:</h4><ul>' +
        Object.entries(cart).map(([name, item]) => `
          <li>${name} x ${item.qty} (@ Rp${item.price.toLocaleString()}) = Rp${(item.qty * item.price).toLocaleString()} <button class="remove-btn" onclick="removeFromCart('${name}')"><i class="fas fa-trash-alt"></i> Hapus</button></li>
        `).join('') + '</ul>';
    }

    function removeFromCart(name) {
      if (cart[name]) {
        cart[name].qty--;
        if (cart[name].qty === 0) delete cart[name];
        updateCart();
      }
    }

    function checkout() {
      alert("Terima kasih telah berbelanja! Total pembayaran Anda adalah " + totalPriceDisplay.textContent);
      cart = {};
      updateCart();
    }

    products.forEach(product => {
      const div = document.createElement('div');
      div.className = 'product';
      div.innerHTML = `
        <img src="${product.image}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p>${product.description}</p>
        <span>Rp${product.price.toLocaleString()}</span>
        <button><i class="fas fa-cart-plus"></i> Tambah ke Keranjang</button>
      `;
      const button = div.querySelector('button');
      button.addEventListener('click', () => {
        if (cart[product.name]) {
          cart[product.name].qty++;
        } else {
          cart[product.name] = { qty: 1, price: product.price };
        }
        updateCart();
      });
      container.appendChild(div);
    });
  </script>
</body>
</html>
