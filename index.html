<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #0d6efd;
      --accent-color: #ffc107;
      --danger-color: #dc3545;
      --background-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #dee2e6;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background-color);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      box-shadow: var(--shadow);
    }
    .cart {
      background-color: white;
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .cart-list {
      max-width: 600px;
      margin: 10px auto;
      padding: 20px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: none;
      box-shadow: var(--shadow);
      animation: fadeIn 0.3s ease-in-out;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      justify-content: center;
    }
    .product {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 15px;
      width: 100%;
      max-width: 220px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: var(--shadow);
    }
    .product:hover {
      transform: translateY(-6px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }
    .product img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }
    .product img:hover {
      transform: scale(1.05);
    }
    .product h3 {
      margin: 10px 0 5px;
      font-size: 18px;
      color: #333;
    }
    .product p {
      font-size: 14px;
      color: #555;
    }
    .product span {
      display: block;
      font-weight: bold;
      margin-top: 8px;
      color: var(--primary-color);
    }
    .product button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      margin-top: 12px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .product button:hover {
      background-color: #e0a800;
    }
    .remove-btn {
      background-color: var(--danger-color);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .remove-btn:hover {
      background-color: #c82333;
    }
    .checkout {
      margin-top: 20px;
      text-align: center;
    }
    .checkout button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .checkout button:hover {
      background-color: #0b5ed7;
    }
    @media (max-width: 600px) {
      .container {
        justify-content: space-between;
      }
      .product {
        flex: 0 0 48%;
        max-width: 48%;
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- ... rest of HTML remains unchanged ... -->
</body>
</html>
